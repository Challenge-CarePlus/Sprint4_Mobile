services:
  - type: web
    name: ecoa-backend
    runtime: node
    plan: free
    rootDir: ECOA_backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  # v3 (modo administrador): serviço SEPARADO pra não derrubar a v2 em produção.
  # Mesmo código-base, branch v3. Plano free: disco efêmero — treinos (data/) e
  # vídeos (uploads/) somem num redeploy/reinício; os usuários mockados e o treino
  # de exemplo são recriados pelo seed. Produção de verdade exige Postgres + storage
  # de objetos (ver CLAUDE.md).
  - type: web
    name: ecoa-backend-v3
    runtime: node
    plan: free
    branch: v3
    rootDir: ECOA_backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Senha do admin: >= 12 caracteres, nunca igual à dos pacientes (ecoa2026) nem óbvia.
      # Sem ela, ou com uma fraca/pública, o servidor NÃO sobe em produção.
      # A usuária define no painel do Render; nunca em chat, commit ou print.
      - key: ADMIN_PASSWORD
        sync: false
      # SÓ PARA DEMONSTRAÇÃO (protótipo em evento): o valor exato "true" deixa o servidor aceitar
      # ADMIN_PASSWORD fraca/pública (inclusive ecoa2026; mínimo 8). Qualquer outro valor ou vazio = desligado.
      # Desligue e troque a senha depois do evento. Nunca com dados reais.
      - key: ALLOW_WEAK_ADMIN_PASSWORD
        sync: false
      # URL(s) do front da v3 na Vercel, separadas por vírgula. As previews do
      # projeto (care-plus-*-isabelabarcellos0812-6004s-projects.vercel.app) já passam
      # pelo regex do código; aqui entra só o domínio fixo, se houver.
      - key: CORS_ORIGIN
        sync: false
      - key: DATA_DIR
        value: /tmp/ecoa-data
      - key: UPLOADS_DIR
        value: /tmp/ecoa-uploads
